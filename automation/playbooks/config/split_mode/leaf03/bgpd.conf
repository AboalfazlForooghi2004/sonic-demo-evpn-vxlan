frr version 8.5.1
frr defaults datacenter
!
hostname leaf03
password zebra
enable password zebra
log syslog informational
log facility local4
!
!
!
router bgp 65103
 bgp router-id 10.0.0.3
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor underlay peer-group
 neighbor underlay remote-as 65199
 neighbor 172.16.1.4 peer-group underlay
 neighbor 172.16.1.4 description spine01
 neighbor 172.16.2.4 peer-group underlay
 neighbor 172.16.2.4 description spine02
 !
 address-family ipv4 unicast
  network 10.0.0.3/32
  neighbor underlay activate
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor underlay activate
  advertise-all-vni
 exit-address-family
!
exit
!
!
!
route-map RM_SET_SRC permit 10
exit
