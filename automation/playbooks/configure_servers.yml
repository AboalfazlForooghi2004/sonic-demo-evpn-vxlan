---
# This script configures the servers.
- hosts: server
  vars:
    ansible_user: ubuntu
    ansible_ssh_pass: nvidia
  become: true
  gather_facts: false
  tasks:

  # This source gives an error when running apt-get update, which must be done to 
  # install ifupdown.
  - name: Remove cumulus apt source file 
    file:
      path: /etc/apt/sources.list.d/apps3_cumulusnetworks_com_repos_deb.list
      state: absent

  - name: Update APT cache
    apt:
      update_cache: yes
      force_apt_get: yes

  # Wait for APT to finish to free dpkg.
  - name: Wait for APT to finish to free dpkg
    pause:
      seconds: 20

  # Install ifupdown.
  - name: Install ifupdown
    apt:
      name: ifupdown
      state: present

  # Remove netplan. 
  - name: Remove netplan
    apt:
      name: netplan.io
      state: absent

  # Configure interfaces file.
  - name: Configure interfaces file
    copy: src=./config/{{inventory_hostname}}/interfaces dest=/etc/network/interfaces
    notify: Reboot system

  handlers:
  # Reboot system.
  - name: Reboot system
    shell: sleep 2 && shutdown -r now "Ansible reboot triggered"
    async: 1
    poll: 0
    ignore_errors: true
    listen: "Reboot system"
  
  # Give system time to come back online.
  - name: Wait for system to come back online
    wait_for_connection:
      connect_timeout: 60
      sleep: 5
      delay: 5
      timeout: 300
    listen: "Reboot system"